<head>

    <title>Environmental Advisory</title>
    <style>
        body {
            margin: 0;
            font-family: 'Times New Roman', serif;
            text-align: center;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        .capsule-box {
            background: rgba(255, 255, 255, 0.2);
            margin: 30px auto;
            width: 90%;
            max-width: 1100px;
            padding: 50px 20px;
            border-radius: 45px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="capsule-box">
        <h1>Environmental Advisory</h1>

        <p>by 24346</p>

</html>
